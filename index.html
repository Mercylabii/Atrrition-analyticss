      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('meridian-theme');
          var preferDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && preferDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F6F7] dark:bg-zinc-950 text-[#18181B] dark:text-zinc-100 antialiased selection:bg-[#6D132B]/15 dark:selection:bg-rose-400/20 selection:text-[#6D132B] dark:selection:text-rose-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
